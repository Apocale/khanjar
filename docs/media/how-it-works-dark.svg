<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>How Khanjar works</title>
  <desc>Press Command J in Premiere Pro: the Khanjar app on your Mac shows the palette, and its plugin inside Premiere applies the chosen effect or preset to the selected clips, over a local connection that refuses web pages. Undo: one Command Z per effect, two or three per preset.</desc>
  <rect width="960" height="330" rx="16" fill="#0b0b0c"/>
  <rect x="22" y="22" width="916" height="286" rx="14" fill="none" stroke="#3a3a3e" stroke-dasharray="6 6"/>
  <text x="44" y="54" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Your Mac — your clips and presets never leave it</text>
  <rect x="44" y="80" width="262" height="196" rx="12" fill="#151517" stroke="#3a3a3e"/>
  <text x="64" y="114" font-size="17" font-weight="650" fill="#ecebe8" text-anchor="start">Khanjar app</text>
  <text x="64" y="144" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Menu bar, ⌘J shortcut</text>
  <text x="64" y="168" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Reads your presets</text>
  <text x="64" y="192" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Learns what you use</text>
  <text x="64" y="216" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Updates itself (signed)</text>
  <rect x="654" y="80" width="262" height="196" rx="12" fill="#151517" stroke="#3a3a3e"/>
  <text x="674" y="114" font-size="17" font-weight="650" fill="#ecebe8" text-anchor="start">Plugin in Premiere</text>
  <text x="674" y="144" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Installed for you</text>
  <text x="674" y="168" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Applies to selected clips</text>
  <text x="674" y="192" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">Undo: one ⌘Z per effect,</text>
  <text x="674" y="216" font-size="14" font-weight="400" fill="#a19f9a" text-anchor="start">two or three per preset</text>
  <rect x="355.0" y="147" width="250" height="62" rx="31" fill="#2680eb"/>
  <text x="480.0" y="174" font-size="15" font-weight="650" fill="#ffffff" text-anchor="middle">Local connection</text>
  <text x="480.0" y="194" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.9">web pages are refused</text>
  <path d="M310 178 H344.0" stroke="#2680eb" stroke-width="3"/>
  <path d="M342.0 172 L351.0 178 L342.0 184 z" fill="#2680eb"/>
  <path d="M609.0 178 H643" stroke="#2680eb" stroke-width="3"/>
  <path d="M641 172 L650 178 L641 184 z" fill="#2680eb"/>
</svg>
