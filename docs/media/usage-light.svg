<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>What an editor actually uses</title>
  <desc>Bar chart from the author's own editing, July to October 2026: 1,279 applications of 41 different effects and presets out of about 420; the three most used presets account for 74 percent, which is why Khanjar opens on the most used items with Command 1 to Command 3.</desc>
  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="469" rx="16" fill="none" stroke="#e2e1dd"/>
  <text x="40" y="56" font-size="21" font-weight="650" fill="#1a1a19" text-anchor="start">One editor, three months, 1,279 effects and presets applied</text>
  <text x="40" y="84" font-size="15.5" font-weight="400" fill="#5f5d58" text-anchor="start">41 different items out of about 420 in the palette — and 3 of them made up 74%.</text>
  <path d="M40 358.5 H920" stroke="#cfcdc8"/>
  <rect x="40.0" y="118.0" width="67.3" height="240.0" rx="4" fill="#e5391b"/>
  <text x="73.63636363636363" y="110.0" font-size="13" font-weight="600" fill="#1a1a19" text-anchor="middle">37%</text>
  <text x="73.63636363636363" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#1</text>
  <rect x="121.3" y="199.2" width="67.3" height="158.8" rx="4" fill="#e5391b"/>
  <text x="154.9090909090909" y="191.1764705882353" font-size="13" font-weight="600" fill="#1a1a19" text-anchor="middle">25%</text>
  <text x="154.9090909090909" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#2</text>
  <rect x="202.5" y="281.4" width="67.3" height="76.6" rx="4" fill="#e5391b"/>
  <text x="236.18181818181816" y="273.3613445378151" font-size="13" font-weight="600" fill="#1a1a19" text-anchor="middle">12%</text>
  <text x="236.18181818181816" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#3</text>
  <rect x="283.8" y="289.9" width="67.3" height="68.1" rx="4" fill="#d4d2cd"/>
  <text x="317.45454545454544" y="281.9327731092437" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">11%</text>
  <text x="317.45454545454544" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#4</text>
  <rect x="365.1" y="341.9" width="67.3" height="16.1" rx="4" fill="#d4d2cd"/>
  <text x="398.7272727272727" y="333.8655462184874" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">3%</text>
  <text x="398.7272727272727" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#5</text>
  <rect x="446.4" y="342.9" width="67.3" height="15.1" rx="4" fill="#d4d2cd"/>
  <text x="479.99999999999994" y="334.87394957983196" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">2%</text>
  <text x="479.99999999999994" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#6</text>
  <rect x="527.6" y="346.4" width="67.3" height="11.6" rx="4" fill="#d4d2cd"/>
  <text x="561.2727272727273" y="338.4033613445378" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">2%</text>
  <text x="561.2727272727273" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#7</text>
  <rect x="608.9" y="348.9" width="67.3" height="9.1" rx="4" fill="#d4d2cd"/>
  <text x="642.5454545454545" y="340.92436974789916" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">1%</text>
  <text x="642.5454545454545" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#8</text>
  <rect x="690.2" y="351.9" width="67.3" height="6.1" rx="4" fill="#d4d2cd"/>
  <text x="723.8181818181818" y="343.9495798319328" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">&lt;1%</text>
  <text x="723.8181818181818" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#9</text>
  <rect x="771.5" y="353.0" width="67.3" height="5.0" rx="4" fill="#d4d2cd"/>
  <text x="805.090909090909" y="344.9579831932773" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">&lt;1%</text>
  <text x="805.090909090909" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">#10</text>
  <rect x="852.7" y="319.7" width="67.3" height="38.3" rx="4" fill="#d4d2cd"/>
  <text x="886.3636363636363" y="311.6806722689076" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">6%</text>
  <text x="886.3636363636363" y="380" font-size="13" font-weight="400" fill="#5f5d58" text-anchor="middle">31 others</text>
  <text x="40" y="404" font-size="15" font-weight="500" fill="#1a1a19" text-anchor="start">That's why the palette opens on what you use:</text>
  <rect x="378" y="385" width="34" height="28" rx="6" fill="#eeeeeb" stroke="#cfcdc8"/>
  <text x="395.0" y="404" font-size="14" font-weight="600" fill="#1a1a19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">⌘1</text>
  <rect x="420" y="385" width="34" height="28" rx="6" fill="#eeeeeb" stroke="#cfcdc8"/>
  <text x="437.0" y="404" font-size="14" font-weight="600" fill="#1a1a19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">⌘2</text>
  <rect x="462" y="385" width="34" height="28" rx="6" fill="#eeeeeb" stroke="#cfcdc8"/>
  <text x="479.0" y="404" font-size="14" font-weight="600" fill="#1a1a19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">⌘3</text>
  <text x="510" y="404" font-size="15" font-weight="400" fill="#5f5d58" text-anchor="start">apply them without typing.</text>
  <text x="40" y="444" font-size="12" font-weight="400" fill="#8a8882" text-anchor="start">Data: the author's own Khanjar log, July to October 2026. Bars = the 10 most applied items, then the 31 others.</text>
</svg>
